<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unblock Me</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#11151c; color:#f4f0e5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; }
    main { width:min(100%, 660px); }
    h1 { margin:0; font-size:clamp(2rem, 8vw, 4rem); letter-spacing:-.08em; }
    .lede { color:#bdc6d5; margin:.45rem 0 1rem; }
    #board { width:min(100%, 560px); aspect-ratio:7/5; display:grid; grid-template-columns:repeat(7, 1fr); grid-template-rows:repeat(5, 1fr); gap:4px; padding:4px; background:#202936; border:2px solid #5c6c80; border-radius:14px; position:relative; touch-action:none; user-select:none; }
    .cell { background:#151b24; border-radius:6px; }
    .checkpoint { background:repeating-linear-gradient(45deg,#80661e 0 7px,#aa8e39 7px 14px); }
    .wall { background:#050608; box-shadow:inset 0 0 0 2px #37404c; }
    .block { z-index:2; margin:4px; border:0; border-radius:10px; cursor:grab; touch-action:none; color:#11151c; font-weight:800; font-size:1rem; box-shadow:0 3px 0 rgba(0,0,0,.25); }
    .block:active { cursor:grabbing; transform:scale(.98); }
    .block[data-block-id="R"] { background:#ff624d; }
    .block[data-block-id="A"] { background:#8cd8ff; }
    .block[data-block-id="B"] { background:#a9ed75; }
    .meta { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin:1rem 0; }
    .badge, button { border-radius:999px; padding:.55rem .8rem; border:1px solid #526178; background:#202936; color:inherit; }
    button { cursor:pointer; font-weight:700; }
    button:hover { background:#303c4d; }
    #status { min-height:1.5rem; color:#bdc6d5; }
    #win { display:none; margin-top:1rem; padding:1rem; border-radius:10px; background:#d8ff7a; color:#17210a; font-weight:850; }
    #win.visible { display:block; }
    .instructions { color:#bdc6d5; font-size:.93rem; }
  </style>
</head>
<body>
  <main>
    <h1>unblock me</h1>
    <p class="lede">Drag a block along its axis. Put the Red Block fully onto the Checkpoint.</p>
    <div id="board" aria-label="Sliding block puzzle"></div>
    <div class="meta">
      <span class="badge" id="moves">0 moves</span>
      <span class="badge" id="seed">Fixed level</span>
      <button data-action="new-level">New generated level</button>
      <button data-action="restart">Restart</button>
    </div>
    <div id="status" role="status">Drag a block one cell at a time.</div>
    <div id="win" role="alert">Checkpoint reached — you win.</div>
    <p class="instructions">Desktop: click and drag. Phone: touch and drag. Blocks only move one cell per drag.</p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
